name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # src 布局：包在 src/team_board 下且未安装，必须把 src 放进 sys.path
      # TZ：summary 的断言是本地时间快照（CST），runner 默认 UTC 会让 5 条快照测试红
      - name: Run pytest
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: python -m pytest -q

  branch-audit:
    name: branch-audit (卡分支/checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Put the runner checkout back on main
        run: git checkout -B main origin/main
      - name: Run branch audit
        env:
          PYTHONPATH: src
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ]; then
            python -m team_board.cli branch-audit --branch "$HEAD_REF"
          else
            python -m team_board.cli branch-audit
          fi

  ruff:
    name: ruff (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 工具版本只从 pyproject 的 [project.optional-dependencies].dev 来
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src tests

  mypy:
    name: mypy (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # files / mypy_path 由 pyproject 的 [tool.mypy] 给
      - name: Run mypy
        run: python -m mypy

  bandit:
    name: bandit (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # 只扫 src：pytest 断言的 B101 是噪声
      - name: Run bandit
        run: python -m bandit -r src -q --severity-level all --confidence-level all
