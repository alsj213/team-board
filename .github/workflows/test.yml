name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # src 布局：包在 src/team_board 下且未安装，必须把 src 放进 sys.path
      # TZ：summary 的断言是本地时间快照（CST），runner 默认 UTC 会让 5 条快照测试红
      - name: Run pytest
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: python -m pytest -q

  branch-audit:
    name: branch-audit (卡分支/checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      # 为什么要先抓一份 src：pull_request 事件上 actions/checkout 检出的是一棵
      # 树，接着为了让规则 B（主 checkout 必须在 main）成立要把检出切回 main ——
      # 一切换，工作区里就是 main 的代码，`python -m team_board.cli` 会退化成
      # 老版本（实测报 `invalid choice: 'branch-audit'`）。所以先把 PR 自己的
      # 代码归档到 RUNNER_TEMP，切回 main 后再用这份 src 跑稽核。
      #
      # 为什么连 .team-board 一起归档：豁免表默认路径是 <被稽核仓库>/.team-board/
      # branch-audit-allow.txt，而切回 main 后被稽核仓库就是 main 的检出 —— 不带上
      # PR 自己的那份，PR 里新加的豁免永远读不到（豁免这个出口就等于不存在）。
      # 本次 PR 自身一条豁免都没有，带上的只是注释头；但这是正确性，不是内容。
      - name: Stage the PR's own source and allowlist (audit must run this build)
        run: |
          mkdir -p "$RUNNER_TEMP/pr-src"
          # 老分支（本 job 合入前切出来的）树里没有 .team-board：把它硬塞进
          # pathspec 会让 git archive 直接 fatal（跟稽核毫无关系的失败 → 假红），
          # 所以先探一下再决定要不要带上；没有就当空表（缺文件=空表，语义已有）。
          PATHS="src"
          if git cat-file -e HEAD:.team-board 2>/dev/null; then
            PATHS="$PATHS .team-board"
          fi
          git archive HEAD $PATHS | tar -x -C "$RUNNER_TEMP/pr-src"
      - name: Put the runner checkout back on main
        run: git checkout -B main origin/main
      - name: Run branch audit
        env:
          PYTHONPATH: ${{ runner.temp }}/pr-src/src
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ALLOW_FILE="$RUNNER_TEMP/pr-src/.team-board/branch-audit-allow.txt"
          if [ -n "$HEAD_REF" ]; then
            # PR：规则 A（提交归属）+ 规则 B（checkout 偏移）全量 —— 不许减少检查项
            python -m team_board.cli branch-audit --branch "$HEAD_REF" \
              --allow-file "$ALLOW_FILE"
          else
            # push 到 main：只跑规则 B（checkout 偏移）。走 CLI 既有契约：指定的分支存在
            # 但不是卡分支 →「… 不是卡分支，跳过提交归属检查」，只做 checkout 检查
            # （README 164–168 行；集成测试 test_branch_main_is_not_a_card_branch）。
            # 老板 2026-10-29 原话「总之就是合入主分支前必须 ci 检验」；决策卡 t_6fab0d6e
            # 选第 3 条：证据分支 wt/t_589cc33a 需长期存在，push 扫全部分支必然天天红。
            python -m team_board.cli branch-audit --branch main --allow-file "$ALLOW_FILE"
          fi

  ruff:
    name: ruff (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 工具版本只从 pyproject 的 [project.optional-dependencies].dev 来
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src tests

  mypy:
    name: mypy (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # files / mypy_path 由 pyproject 的 [tool.mypy] 给
      - name: Run mypy
        run: python -m mypy

  bandit:
    name: bandit (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # 只扫 src：pytest 断言的 B101 是噪声
      - name: Run bandit
        run: python -m bandit -r src -q --severity-level all --confidence-level all

  commit-identity:
    name: commit-identity (author 白名单 + committer 是本 bot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      # 判定逻辑全在 scripts/ci-commit-identity.sh，这里只做四件事：
      # checkout / setup-python / fetch / 调脚本。脚本自己从 `git show origin/main:` 读镜像表
      # （PR 分支里改 .team-board/cards.tsv 不参与判定），卡不在表里就回落到默认白名单
      # {engineer, qa}，不再 fail closed 把别的卡的 PR 锁死。
      # PR 的 checkout 是 detached HEAD → 分支名取 github.head_ref；push 到 main 时为空，退回
      # `git branch --show-current`（= main，非卡分支 → 脚本 skip rc0）。
      - name: Run commit identity audit
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUDIT_REV: ${{ github.event_name == 'push' && 'origin/main' || github.event.pull_request.head.sha }}
        run: |
          BRANCH="${HEAD_REF:-$(git branch --show-current)}"
          bash scripts/ci-commit-identity.sh "$PWD" "$BRANCH" "$AUDIT_REV"

  merge-accountability:
    name: merge-accountability (合并认账字段)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 为什么要抓全部分支、且不能判 HEAD：
      # pull_request 事件下 actions/checkout 检出的是 refs/pull/N/merge 这条**合成合并提交**，
      # 它天然没有认账字段，判 HEAD 会永久假红；所以：
      #   push 到 main → 判 github.sha（**不是** origin/main：并发合并时 fetch 到的
      #                  origin/main 可能已经前进到别人的提交上，红会记错提交）
      #   PR          → 判 github.event.pull_request.head.sha（PR 分支自己的提交，抓演示/违规）
      #
      # 基线**只认 base 侧那份文件**（P2-4）：checkout 出来的是 PR 的合并树，读检出树里的
      # .team-board/merge-audit-baseline 等于让被审 PR 自己决定判定区间（它能改成 main
      # 尖端 → 区间变空 → 永远绿）。所以先用 BASE_REF 把 **base 侧**那份 `git show` 到一个
      # 临时文件，再 --baseline-file 喂给工具；工具只认这个参数，不读检出树。
      #   pull_request → BASE_REF = origin/<base_ref>（基线文件由 main 侧提供）
      #   push         → BASE_REF = github.event.before（上一个 main 尖端；新分支全 0 或
      #                  读不到该文件时 **rc=2 红**，属预期 fail-closed）
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Read base-side baseline file
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: |
          echo "BASE_REF=$BASE_REF"
          git show "$BASE_REF:.team-board/merge-audit-baseline" > "$RUNNER_TEMP/baseline" || exit 2
          echo "基线（base 侧）: $(cat "$RUNNER_TEMP/baseline")"
      - name: Run merge accountability audit
        env:
          PYTHONPATH: src
          AUDIT_REV: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          echo "AUDIT_REV=$AUDIT_REV"
          python -m team_board.cli merge-audit --repo . --rev "$AUDIT_REV" \
            --baseline-file "$RUNNER_TEMP/baseline"
