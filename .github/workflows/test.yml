name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # src 布局：包在 src/team_board 下且未安装，必须把 src 放进 sys.path
      # TZ：summary 的断言是本地时间快照（CST），runner 默认 UTC 会让 5 条快照测试红
      - name: Run pytest
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: python -m pytest -q
