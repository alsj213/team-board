name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # src 布局：包在 src/team_board 下且未安装，必须把 src 放进 sys.path
      # TZ：summary 的断言是本地时间快照（CST），runner 默认 UTC 会让 5 条快照测试红
      - name: Run pytest
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: python -m pytest -q

  branch-audit:
    name: branch-audit (卡分支/checkout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all branches
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      # 为什么要先抓一份 src：pull_request 事件上 actions/checkout 检出的是一棵
      # 树，接着为了让规则 B（主 checkout 必须在 main）成立要把检出切回 main ——
      # 一切换，工作区里就是 main 的代码，`python -m team_board.cli` 会退化成
      # 老版本（实测报 `invalid choice: 'branch-audit'`）。所以先把 PR 自己的
      # 代码归档到 RUNNER_TEMP，切回 main 后再用这份 src 跑稽核。
      - name: Stage the PR's own source (audit must run this build, not main)
        run: |
          mkdir -p "$RUNNER_TEMP/pr-src"
          git archive HEAD src | tar -x -C "$RUNNER_TEMP/pr-src"
      - name: Put the runner checkout back on main
        run: git checkout -B main origin/main
      - name: Run branch audit
        env:
          PYTHONPATH: ${{ runner.temp }}/pr-src/src
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ]; then
            python -m team_board.cli branch-audit --branch "$HEAD_REF"
          else
            python -m team_board.cli branch-audit
          fi

  ruff:
    name: ruff (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 工具版本只从 pyproject 的 [project.optional-dependencies].dev 来
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src tests

  mypy:
    name: mypy (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # files / mypy_path 由 pyproject 的 [tool.mypy] 给
      - name: Run mypy
        run: python -m mypy

  bandit:
    name: bandit (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # 只扫 src：pytest 断言的 B101 是噪声
      - name: Run bandit
        run: python -m bandit -r src -q --severity-level all --confidence-level all
