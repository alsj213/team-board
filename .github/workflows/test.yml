name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # src 布局：包在 src/team_board 下且未安装，必须把 src 放进 sys.path
      # TZ：summary 的断言是本地时间快照（CST），runner 默认 UTC 会让 5 条快照测试红
      - name: Run pytest
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: python -m pytest -q

  ruff:
    name: ruff (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 工具版本只从 pyproject 的 [project.optional-dependencies].dev 来
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src tests

  mypy:
    name: mypy (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # files / mypy_path 由 pyproject 的 [tool.mypy] 给
      - name: Run mypy
        run: python -m mypy

  bandit:
    name: bandit (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -e ".[dev]"

      # 只扫 src：pytest 断言的 B101 是噪声
      - name: Run bandit
        run: python -m bandit -r src -q --severity-level all --confidence-level all
